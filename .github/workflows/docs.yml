# Build the site with Zensical and deploy it to GitHub Pages.
# Based on the workflow generated by `zensical new`.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # Pinned to the version in uv.lock: template overrides depend on the
      # theme, so upgrade deliberately (update both places, then test locally).
      - run: pip install "zensical==0.1.0"
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
